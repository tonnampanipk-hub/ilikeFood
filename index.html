<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดหมายถึงเธอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4e5e7;
    --env-back: #cfd1d4;
    --env-front: #f4f4f5;
    --env-flap: #fafafa;
    --paper: #ffffff;
    --ink: #3d4046;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Mali", "Sarabun", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: 110px;
    overflow-x: hidden;
  }

  .scene { perspective: 1200px; }

  /* wrapper: idle float + move down when opened */
  .float { animation: bob 3.2s ease-in-out infinite; }
  .float.open { animation: none; transform: translateY(40px); transition: transform .7s cubic-bezier(.3,.8,.3,1); }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .envelope {
    position: relative;
    width: min(340px, 86vw);
    aspect-ratio: 340 / 230;
    background: var(--env-back);
    border-radius: 6px;
    cursor: pointer;
    border: 0;
    padding: 0;
    display: block;
    box-shadow: 0 18px 30px -12px rgba(0,0,0,.25);
    -webkit-tap-highlight-color: transparent;
  }
  .envelope:focus-visible { outline: 3px solid #6b6f78; outline-offset: 6px; }

  /* the letter */
  .letter {
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: 6%;
    height: 78%;
    background: var(--paper);
    border-radius: 4px;
    padding: 22px 20px;
    overflow: hidden;
    z-index: 2;
    text-align: left;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    transition: height 1s cubic-bezier(.25,.8,.25,1) .5s;
  }
  .letter p {
    font-size: 15px;
    line-height: 1.95;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .letter p + p { margin-top: 14px; }

  /* front pocket */
  .front {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: var(--env-front);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    border-radius: 6px;
  }

  /* flap */
  .flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 56%;
    background: var(--env-flap);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    z-index: 4;
    transition: transform .7s cubic-bezier(.4,0,.2,1), z-index 0s .35s;
  }

  /* open state */
  .open .flap { transform: rotateX(180deg); z-index: 1; }
  .open .letter { height: 300px; }
  .open .letter p { opacity: 1; transform: none; }
  .open .letter p:nth-child(1) { transition-delay: 1.3s; }
  .open .letter p:nth-child(2) { transition-delay: 2s; }

  @media (prefers-reduced-motion: reduce) {
    .float { animation: none; }
    * { transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="float" id="float">
      <button class="envelope" id="env" aria-expanded="false" aria-label="เปิดจดหมาย">
        <div class="letter">
          <p>ชั้นไม่รู้แกยังนอยอยู่มั้ยนะแต่ชั้นอยากให้แกสู้ๆนะอย่าเครียดบ่อย เดี๋ยวแก่ไวขึ้น ชั้ยอยากให้แกยิ้มเยอะๆนะเข้าใจมั้ยนิไม่เข้าใจระวังโดนต่อย</p>
        </div>
        <div class="front"></div>
        <div class="flap"></div>
      </button>
    </div>
  </div>

<script>
  const env = document.getElementById('env');
  const wrap = document.getElementById('float');
  env.addEventListener('click', () => {
    const open = !env.classList.contains('open');
    env.classList.toggle('open', open);
    wrap.classList.toggle('open', open);
    env.setAttribute('aria-expanded', open);
    env.setAttribute('aria-label', open ? 'ปิดจดหมาย' : 'เปิดจดหมาย');
  });
</script>
</body>
</html>
